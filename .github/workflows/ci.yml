name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore TawkMcp.slnx
      - run: dotnet build TawkMcp.slnx --no-restore -c Release -warnaserror
      - run: dotnet test TawkMcp.slnx --no-build -c Release
