# tawk-mcp serves streamable HTTP (its default transport) on 127.0.0.1:8765 with a bearer token.
# Run with scripts/docker-run.sh, or export UID and GID first: UID=$(id -u) GID=$(id -g) docker compose up -d
# Create "$XDG_RUNTIME_DIR/tawk" and ~/.config/tawk-mcp yourself (mode 0700) before the first start,
# otherwise Docker creates them owned by root and neither tawk nor tawk-mcp can use them.
services:
  tawk-mcp:
    build: .
    image: tawk-mcp:0.1.0
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      TAWK_CONTROL_SOCKET: /run/tawk/control.sock
      TAWKMCP_TOKEN_FILE: /data/token
      TAWKMCP_DATA_FILE: /data/memory.db
    volumes:
      - "${XDG_RUNTIME_DIR:-/run/user/1000}/tawk:/run/tawk"
      - "${HOME}/.config/tawk-mcp:/data"
    restart: unless-stopped
